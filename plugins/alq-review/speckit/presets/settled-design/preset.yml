schema_version: "1.0"

preset:
  id: "settled-design"
  name: "Settled Design"
  version: "1.1.0"
  description: "spec.md carries the premise answers and a labelled root cause (checked by alq-review's rootcause.py); plan.md lists its mechanisms, each citing a research.md decision that names the existing tools looked at (checked by alq-review's settled_design.py)."
  author: "Analitiq"
  repository: "https://github.com/analitiq-ai/claude-plugins-internal"
  license: "Proprietary"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Append the Mechanisms section and the research.md decision format"
      strategy: "append"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Append the premise answers and the root cause section"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "The premise answers come from the premise report; the root cause follows the spec template"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Research decisions follow the plan template's format"
      strategy: "append"
