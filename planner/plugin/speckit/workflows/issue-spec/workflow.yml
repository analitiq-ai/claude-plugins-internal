schema_version: "1.0"
workflow:
  id: "issue-spec"
  name: "Spec Cycle"
  version: "1.6.0"
  author: "Analitiq"
  description: "Settles design decisions in a spec folder before a design document is drafted: premise → specify → grill → plan → critique → tasks"

requires:
  speckit_version: ">=1.0.7"
  integrations:
    any: ["claude"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the document change and the decisions it must make"
  # Steps read the issue from $ISSUE, never from this input, for the reason given for spec_dir.
  issue:
    type: string
    required: true
    prompt: "GitHub issue number"
  # The run's one spec folder, on every run. Shell steps read it from $SPECIFY_FEATURE_DIRECTORY, never from this
  # input: template text is spliced into shell source before the shell can validate it.
  spec_dir:
    type: string
    required: true
    prompt: "Spec folder, specs/<issue>-<short-name>"
  # Never read from whether a folder was given: every run is given one.
  kind:
    type: string
    required: true
    enum: ["new", "rescope"]
    prompt: "new or rescope"
  integration:
    type: string
    default: "claude"
    prompt: "Integration to use"
  # Gate verdicts for runs driven without a terminal (the /planner:issue-spec skill passes them on resume).
  premise_verdict:
    type: string
    default: ""
  grill_verdict:
    type: string
    default: ""
  critique_verdict:
    type: string
    default: ""

steps:
  # The kind is one of its enum by now, never text the user typed. Where the run starts is decided here, once.
  - id: check-folder
    type: shell
    output_format: json
    run: python3 "$PLANNER_ROOT/scripts/spec_folder.py" check "$SPECIFY_FEATURE_DIRECTORY" "$ISSUE" "{{ inputs.kind }}"

  # Whether the issue is worth a spec is asked before one is written. The questions are answered in the session,
  # which a headless command step cannot do. A rescope of a spec amends one already judged worth writing; the issue of
  # a no-spec folder is judged again.
  - id: new-spec
    type: if
    condition: "{{ steps.check-folder.output.data.starts_at == 'premise' }}"
    then:
      # The verdict is the outcome itself, so no pick reads as approving or rejecting another.
      - id: premise
        type: gate
        message: "In Claude Code, answer the premise questions for this issue, then pick the outcome."
        options: [write the spec, no spec needed, not worth doing]
        verdict_input: premise_verdict
        on_reject: skip

      # The choice is one of the gate's three options by now, never the text the user typed.
      - id: premise-report
        type: shell
        run: python3 "$PLANNER_ROOT/scripts/premise_report.py" check ".specify/workflows/runs/{{ context.run_id }}/premise-report.md" "{{ steps.premise.output.choice }}"

      - id: not-worth-doing
        type: if
        condition: "{{ steps.premise.output.choice == 'not worth doing' }}"
        then:
          # Planner closes no issue and posts nothing on it (planner ADR-0006, decisions 1 and 2): the close is the
          # admin's, so the run names it. The reason is read before it is printed: inside printf's argument list a
          # failure would not stop the shell.
          - id: name-close
            type: shell
            run: |
              set -eu
              reason=$(python3 "$PLANNER_ROOT/scripts/premise_report.py" reason ".specify/workflows/runs/{{ context.run_id }}/premise-report.md")
              printf 'Close #%s as not planned: %s\n' "$ISSUE" "$reason"

      # The folder lets a later scope of the issue see it was judged.
      - id: no-spec-needed
        type: if
        condition: "{{ steps.premise.output.choice == 'no spec needed' }}"
        then:
          - id: write-no-spec
            type: shell
            run: python3 "$PLANNER_ROOT/scripts/no_spec.py" write "$SPECIFY_FEATURE_DIRECTORY" ".specify/workflows/runs/{{ context.run_id }}/premise-report.md"
          - id: spec-facts-no-spec
            type: shell
            run: node "$PLANNER_ROOT/scripts/spec_facts.ts" write "$SPECIFY_FEATURE_DIRECTORY"

  # A resume re-runs the top-level step the run stopped in, with everything nested in it. So each step below is
  # top-level and skips itself on a stop pick, instead of all of them sharing one block.

  # specify writes spec.md from the template, over a no-spec one, so a rescope of a spec skips it and grill amends the
  # spec in place.
  - id: scope
    type: if
    condition: &spec-is-written "{{ steps.check-folder.output.data.starts_at == 'grill' or steps.premise.output.choice == 'write the spec' }}"
    then:
      - id: scope-kind
        type: if
        condition: "{{ steps.check-folder.output.data.starts_at == 'grill' }}"
        then:
          # No step here reads it back: grill runs in the session, without the run's environment, and finds the
          # folder through feature.json. check-folder has graded the folder, so it goes into the JSON as it is.
          - id: select-spec
            type: shell
            run: |
              printf '{\n  "feature_directory": "%s"\n}\n' "$SPECIFY_FEATURE_DIRECTORY" > .specify/feature.json
        else:
          # The folder is in the prompt as well as the environment: the agent reads its prompt, Spec Kit's scripts
          # read the environment.
          - id: specify
            command: speckit.specify
            integration: "{{ inputs.integration }}"
            input:
              args: "{{ inputs.spec }}\n\nSPECIFY_FEATURE_DIRECTORY: {{ inputs.spec_dir }}\n\nPremise report: .specify/workflows/runs/{{ context.run_id }}/premise-report.md"
          - id: check-specify-folder
            type: shell
            run: python3 "$PLANNER_ROOT/scripts/spec_folder.py" recorded "$SPECIFY_FEATURE_DIRECTORY"

  - id: new-spec-root-cause
    type: if
    condition: "{{ steps.premise.output.choice == 'write the spec' }}"
    then:
      - id: root-cause
        type: shell
        run: |
          set -eu
          python3 "$PLANNER_ROOT/scripts/rootcause.py" check "$SPECIFY_FEATURE_DIRECTORY" ".specify/workflows/runs/{{ context.run_id }}/premise-report.md"
      - id: premise-answers
        type: shell
        run: |
          set -eu
          python3 "$PLANNER_ROOT/scripts/premise_report.py" spec "$SPECIFY_FEATURE_DIRECTORY"

  # grill interviews the author, which a headless command step cannot do.
  - id: to-grill
    type: if
    condition: *spec-is-written
    then:
      - id: grill
        type: gate
        message: "In Claude Code, run /speckit-grill-me on this spec and answer every question. Approve when grill has finished."
        options: [approve, reject]
        verdict_input: grill_verdict
        on_reject: abort

  - id: to-no-open-markers
    type: if
    condition: *spec-is-written
    then:
      - id: no-open-markers
        type: shell
        run: |
          set -eu
          test -f "$SPECIFY_FEATURE_DIRECTORY/spec.md" || { echo "no spec.md in $SPECIFY_FEATURE_DIRECTORY" >&2; exit 1; }
          found=0
          grep -n "NEEDS CLARIFICATION" "$SPECIFY_FEATURE_DIRECTORY/spec.md" || found=$?
          case $found in
            0) echo "Open clarification markers remain in $SPECIFY_FEATURE_DIRECTORY/spec.md" >&2; exit 1 ;;
            1) ;;
            *) exit "$found" ;;
          esac

  # Grill may rewrite the root cause section, so it is graded again; on a new spec, the premise answers too. A
  # rescope of a spec has no premise report: its premise answers are not graded, and its root cause is graded without
  # one.
  - id: to-root-cause-regrade
    type: if
    condition: *spec-is-written
    then:
      - id: root-cause-regrade
        type: if
        condition: "{{ steps.check-folder.output.data.starts_at == 'grill' }}"
        then:
          - id: root-cause-of-rescope
            type: shell
            run: |
              set -eu
              python3 "$PLANNER_ROOT/scripts/rootcause.py" check "$SPECIFY_FEATURE_DIRECTORY"
        else:
          - id: root-cause-after-grill
            type: shell
            run: |
              set -eu
              python3 "$PLANNER_ROOT/scripts/rootcause.py" check "$SPECIFY_FEATURE_DIRECTORY" ".specify/workflows/runs/{{ context.run_id }}/premise-report.md"
          - id: premise-answers-after-grill
            type: shell
            run: |
              set -eu
              python3 "$PLANNER_ROOT/scripts/premise_report.py" spec "$SPECIFY_FEATURE_DIRECTORY"
          # After the last grading step, so the block says what grill's rewrite settled. A rescope's facts are
          # written where it lands, not here.
          - id: spec-facts
            type: shell
            run: node "$PLANNER_ROOT/scripts/spec_facts.ts" write "$SPECIFY_FEATURE_DIRECTORY" ".specify/workflows/runs/{{ context.run_id }}/premise-report.md"

  - id: to-plan
    type: if
    condition: *spec-is-written
    then:
      - id: plan
        command: speckit.plan
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

  # Every mechanism the plan lists cites a research decision naming the existing tools looked at.
  - id: to-settled-design
    type: if
    condition: *spec-is-written
    then:
      - id: settled-design
        type: shell
        run: |
          set -eu
          python3 "$PLANNER_ROOT/scripts/settled_design.py" "$SPECIFY_FEATURE_DIRECTORY"

  - id: to-mark-critiques
    type: if
    condition: *spec-is-written
    then:
      - id: mark-critiques
        type: shell
        run: python3 .specify/workflows/issue-spec/critique_report.py mark "$SPECIFY_FEATURE_DIRECTORY"

  - id: to-critique
    type: if
    condition: *spec-is-written
    then:
      - id: critique
        command: speckit.critique.run
        integration: "{{ inputs.integration }}"

  - id: to-new-critique
    type: if
    condition: *spec-is-written
    then:
      - id: new-critique
        type: shell
        output_format: json
        run: python3 .specify/workflows/issue-spec/critique_report.py find "$SPECIFY_FEATURE_DIRECTORY"

  - id: to-review-critique
    type: if
    condition: *spec-is-written
    then:
      - id: review-critique
        type: gate
        message: "Review the critique. Fix the spec/plan for every finding you accept, then approve."
        show_file: "{{ steps.new-critique.output.data.path }}"
        options: [approve, reject]
        verdict_input: critique_verdict
        on_reject: abort

  - id: to-tasks
    type: if
    condition: *spec-is-written
    then:
      - id: tasks
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
