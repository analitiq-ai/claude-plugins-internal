schema_version: "1.0"

preset:
  id: "settled-design"
  name: "Settled Design"
  version: "1.2.0"
  description: "spec.md has a section for the premise answers and one for the root cause (planner's rootcause.py checks that the root cause section is there and labelled); plan.md lists its mechanisms, each citing a research.md decision that has an Existing tools field (checked by planner's settled_design.py)."
  author: "Analitiq"
  repository: "https://github.com/analitiq-ai/claude-plugins-internal"
  license: "Proprietary"

requires:
  speckit_version: ">=1.1.3,<1.2.0"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Append the Mechanisms section and the research.md decision format"
      strategy: "append"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Open with the codeworks front matter planner sets; append the premise answers and the root cause section"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "The premise answers come from the premise report; the root cause follows the spec template"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Research decisions follow the plan template's format"
      strategy: "append"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Each file a task touches is one literal path in its own backtick span"
      strategy: "append"
