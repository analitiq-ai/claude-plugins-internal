schema_version: "1.0"

preset:
  id: "settled-design"
  name: "Settled Design"
  version: "1.2.0"
  description: "spec.md opens with a note fixing its headings and defining its ids (root ADR-0012 d1) and has a Non-goals section, a section for the premise answers and one for the root cause (planner's rootcause.py checks that the root cause section is there and labelled); plan.md lists its mechanisms, each citing a research.md decision that has an Existing tools field (checked by planner's settled_design.py)."
  author: "Analitiq"
  repository: "https://github.com/analitiq-ai/claude-plugins-internal"
  license: "Proprietary"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Append the Mechanisms section and the research.md decision format"
      strategy: "append"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Open with the codeworks front matter planner sets and the note fixing the headings and defining the ids; append the Non-goals section, the premise answers and the root cause section"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Every `## ` heading stays; scenarios, edge cases and success criteria carry the ids the template's note defines; Non-goals, the premise answers and the root cause follow the spec template"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Research decisions follow the plan template's format"
      strategy: "append"
