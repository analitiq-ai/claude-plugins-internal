name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: echo "suites=$(find dev -type d -name tests -not -path '*/fixtures/*' | sort | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  unittest:
    name: unittest (${{ matrix.suite }})
    needs: suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: claude-plugins-internal
      # alq-review's attestation marker is pinned against the org pr-gate that reads it, checked out beside
      # this repo as it is locally.
      - uses: actions/checkout@v5
        with:
          repository: analitiq-ai/.github
          path: analitiq-org-github
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # alq-spec drives the real Spec Kit CLI, at the minimum version its workflow declares.
      - run: pip install specify-cli==1.0.7
      # alq-review's claim and shim checks map text across edits with it and refuse to run without it.
      - run: pip install diff-match-patch==20241021
      # alq-review asks adrkit which decisions govern a round's change; its tests run the real CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @adrkit/cli@0.20.0
      - name: Run suite
        working-directory: claude-plugins-internal/${{ matrix.suite }}
        run: python -m unittest -v
