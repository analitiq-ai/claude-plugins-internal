name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: echo "suites=$(find * -mindepth 1 -maxdepth 1 -type d -name tests | sort | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  unittest:
    name: unittest (${{ matrix.suite }})
    needs: suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: claude-plugins-internal
      # reviewer's attestation marker is pinned against the org pr-gate that reads it, checked out beside
      # this repo as it is locally.
      - uses: actions/checkout@v5
        with:
          repository: analitiq-ai/.github
          path: analitiq-org-github
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # planner drives the real Spec Kit CLI, at the minimum version its workflow declares.
      - run: pip install specify-cli==1.1.3
      # reviewer's claim and shim checks map text across edits with it and refuse to run without it.
      - run: pip install diff-match-patch==20241021
      # reviewer asks adrkit which decisions govern a round's change, at the one version it is built for.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @adrkit/cli@0.20.0
      # A suite runs what its component holds. A carrier's code resolves core's imports from core's own
      # node_modules (Node follows the plugin's core link), so core's packages go in for every suite.
      - name: Run suite
        working-directory: claude-plugins-internal
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          component="${SUITE%/tests}"
          if [ "$component" != core ]; then (cd core && npm ci); fi
          if [ -f "$component/plugin/package-lock.json" ]; then (cd "$component/plugin" && npm ci); fi
          if [ -f "$component/package.json" ]; then (cd "$component" && npm ci && npm test); fi
          if compgen -G "$SUITE/test_*.py" > /dev/null; then (cd "$SUITE" && python -m unittest -v); fi

  # Every plugin carrying core pins core's dependencies and bumps its version when core changes. On main it runs
  # again against the previous commit: two PRs that each passed on a stale base can bump a carrier to one version.
  carriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: core
        run: npm ci
      - working-directory: core
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: node scripts/check-carriers.ts --base "$BASE"
